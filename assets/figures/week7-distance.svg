<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc">
<title id="title">Most lexical neighbors are one hyperlink away, with exceptions</title>
<desc id="desc">Paired percentage bars compare graph distance for one highest-cosine lexical neighbor per article with every eligible source-target alternative. Both include disconnected pairs as a separate category. The baseline weights each source equally; reciprocal nearest-neighbor choices count twice. Percentages compare differently sized denominators, with counts printed beside each bar. 194 of 303 lexical-neighbor choices are one link apart, compared with 3.13% of all eligible choices.</desc>
<rect width="1040" height="680" fill="#faf7f0"/>
<g font-family="Arial, sans-serif" fill="#18243a">
<text x="52" y="49" font-size="29" font-weight="700">Close words usually mean a short route.</text>
<text x="52" y="80" font-size="16">Frozen Marvel pages: title-masked TF-IDF cosine and undirected hyperlink distance.</text>
<rect x="52" y="107" width="13" height="13" fill="#c84527"/><text x="75" y="119" font-size="14">Highest-cosine neighbor: 303 source choices</text>
<rect x="475" y="107" width="13" height="13" fill="#2849c7"/><text x="498" y="119" font-size="14">All alternatives: 91,506 ordered choices</text>
