<text x="630.75" y="387" font-size="12">41.1% (37,620)</text>
<text x="222" y="443" text-anchor="end" font-size="16" font-weight="700">4+ links</text>
<rect x="240" y="426" width="33.711" height="20" rx="2" fill="#c84527"><title>4+ links: 11 / 303 (3.63%)</title></rect>
<text x="282.71" y="441" font-size="12">3.6% (11)</text>
<rect x="240" y="454" width="82.500" height="20" rx="2" fill="#2849c7"><title>4+ links: 8,130 / 91,506 (8.88%)</title></rect>
<text x="331.50" y="469" font-size="12">8.9% (8,130)</text>
<text x="222" y="525" text-anchor="end" font-size="16" font-weight="700">Disconnected</text>
