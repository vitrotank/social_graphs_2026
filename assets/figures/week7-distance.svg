<text x="401.03" y="551" font-size="12">16.4% (14,982)</text>
<text x="52" y="642" font-size="13">Reciprocal choices count twice. No-path pairs stay disconnected; they are excluded from 4+ links.</text>
<text x="52" y="664" font-size="12">Lexical similarity is not semantic accuracy. Frozen course corpus and roster, 26 Aug 2026; full method and text evidence in the post.</text>
</g></svg>
