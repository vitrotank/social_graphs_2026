<text x="389.97" y="277" font-size="12">15.2% (46)</text>
<rect x="240" y="290" width="283.180" height="20" rx="2" fill="#2849c7"><title>2 links: 27,906 / 91,506 (30.50%)</title></rect>
<text x="532.18" y="305" font-size="12">30.5% (27,906)</text>
<text x="222" y="361" text-anchor="end" font-size="16" font-weight="700">3 links</text>
<rect x="240" y="344" width="95.002" height="20" rx="2" fill="#c84527"><title>3 links: 31 / 303 (10.23%)</title></rect>
<text x="344.00" y="359" font-size="12">10.2% (31)</text>
