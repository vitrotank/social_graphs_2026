<text x="704.29" y="605" text-anchor="middle" font-size="12">50%</text>
<path d="M 797.14 157 V 583" stroke="#daddda"/>
<text x="797.14" y="605" text-anchor="middle" font-size="12">60%</text>
<path d="M 890.00 157 V 583" stroke="#daddda"/>
<text x="890.00" y="605" text-anchor="middle" font-size="12">70%</text>
<text x="222" y="197" text-anchor="end" font-size="16" font-weight="700">1 link</text>
<rect x="240" y="180" width="594.531" height="20" rx="2" fill="#c84527"><title>1 link: 194 / 303 (64.03%)</title></rect>
<text x="843.53" y="195" font-size="12">64.0% (194)</text>
<rect x="240" y="208" width="29.103" height="20" rx="2" fill="#2849c7"><title>1 link: 2,868 / 91,506 (3.13%)</title></rect>
<text x="278.10" y="223" font-size="12">3.1% (2,868)</text>
<text x="222" y="279" text-anchor="end" font-size="16" font-weight="700">2 links</text>
