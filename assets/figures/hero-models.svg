<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="hero-models-title hero-models-desc">
  <title id="hero-models-title">Crosstalk: Three Network Universes</title>
  <desc id="hero-models-desc">A comparative switchboard diagram showing three network architectures: Erdős–Rényi random network, Barabási–Albert preferential attachment hub-and-spoke, and the empirical Marvel switchboard with degree-preserving rewiring.</desc>
  <rect width="680" height="650" fill="#172a48"/>
  
  <!-- Subtle Blueprint Grid -->
  <g fill="none" stroke="#b0bdd9" stroke-opacity=".12" stroke-width=".7">
    <rect x="24" y="58" width="632" height="520" rx="10"/>
    <line x1="235" y1="58" x2="235" y2="578" stroke-dasharray="3 5"/>
    <line x1="445" y1="58" x2="445" y2="578" stroke-dasharray="3 5"/>
    <line x1="24" y1="380" x2="656" y2="380" stroke-opacity=".18"/>
  </g>

  <!-- Top Title Bar inside figure -->
  <g font-family="Consolas, monospace" font-size="9" fill="#b0c4b5" letter-spacing="1.2">
    <text x="36" y="38">PANEL 02: THE MULTIVERSE COMPARISON</text>
    <text x="644" y="38" text-anchor="end" fill="#f2a078">NULL-MODEL LAB</text>
  </g>

  <!-- COLUMN 1: ERDŐS–RÉNYI G(n, p) -->
  <g id="model-er">
    <rect x="36" y="72" width="186" height="296" rx="6" fill="#132238" stroke="#2849c7" stroke-opacity=".3"/>
    <text x="48" y="94" font-family="Consolas, monospace" font-size="10" fill="#98b5e2" font-weight="bold">01 · ERDŐS–RÉNYI</text>
    <text x="48" y="108" font-family="Consolas, monospace" font-size="8" fill="#7a8fa6">POISSON · NO HUBS</text>
    
    <!-- Uniform random mesh -->
    <g stroke="#6184b8" stroke-opacity=".35" stroke-width=".8">
      <line x1="65" y1="150" x2="115" y2="135"/>
      <line x1="115" y1="135" x2="170" y2="160"/>
      <line x1="170" y1="160" x2="180" y2="220"/>
      <line x1="180" y1="220" x2="130" y2="265"/>
      <line x1="130" y1="265" x2="65" y2="235"/>
      <line x1="65" y1="235" x2="65" y2="150"/>
      <line x1="115" y1="135" x2="130" y2="265"/>
      <line x1="65" y1="150" x2="180" y2="220"/>
      <line x1="120" y1="195" x2="65" y2="150"/>
      <line x1="120" y1="195" x2="170" y2="160"/>
      <line x1="120" y1="195" x2="130" y2="265"/>
      <line x1="120" y1="195" x2="65" y2="235"/>
      <line x1="90" y1="170" x2="150" y2="210"/>
    </g>
    <!-- Equal size nodes -->
    <g fill="#adc5f5">
      <circle cx="65" cy="150" r="4"/>
      <circle cx="115" cy="135" r="4.2"/>
      <circle cx="170" cy="160" r="3.8"/>
      <circle cx="180" cy="220" r="4.1"/>
      <circle cx="130" cy="265" r="3.9"/>
      <circle cx="65" cy="235" r="4"/>
      <circle cx="120" cy="195" r="4.3"/>
      <circle cx="90" cy="170" r="3.7"/>
      <circle cx="150" cy="210" r="4.1"/>
    </g>
    <text x="48" y="320" font-family="Consolas, monospace" font-size="8.5" fill="#a9bddb">Clustering: C ≈ 0.037</text>
    <text x="48" y="335" font-family="Consolas, monospace" font-size="8.5" fill="#a9bddb">Max Degree: k = 8</text>
    <text x="48" y="350" font-family="Consolas, monospace" font-size="8.5" fill="#a9bddb">Isolates: ~0 (0.02)</text>
  </g>

  <!-- COLUMN 2: BARABÁSI–ALBERT -->
  <g id="model-ba">
    <rect x="246" y="72" width="186" height="296" rx="6" fill="#132238" stroke="#ff956d" stroke-opacity=".3"/>
    <text x="258" y="94" font-family="Consolas, monospace" font-size="10" fill="#f4c6a0" font-weight="bold">02 · BARABÁSI–ALBERT</text>
    <text x="258" y="108" font-family="Consolas, monospace" font-size="8" fill="#b58f7e">GROWTH + ATTACHMENT</text>
    
    <!-- Star spoke edges radiating to mega hub -->
    <g stroke="#dfa27b" stroke-opacity=".4" stroke-width=".8">
      <line x1="339" y1="200" x2="280" y2="140" stroke-width="1.2"/>
      <line x1="339" y1="200" x2="340" y2="130" stroke-width="1.2"/>
      <line x1="339" y1="200" x2="398" y2="145" stroke-width="1.2"/>
      <line x1="339" y1="200" x2="410" y2="195" stroke-width="1.2"/>
      <line x1="339" y1="200" x2="390" y2="255" stroke-width="1.2"/>
      <line x1="339" y1="200" x2="330" y2="270" stroke-width="1.2"/>
      <line x1="339" y1="200" x2="275" y2="245" stroke-width="1.2"/>
      <line x1="339" y1="200" x2="265" y2="185" stroke-width="1.2"/>
      <!-- minor secondary links -->
      <line x1="280" y1="140" x2="340" y2="130" stroke-width=".6"/>
      <line x1="390" y1="255" x2="410" y2="195" stroke-width=".6"/>
    </g>
    <!-- Peripheral small nodes -->
    <g fill="#eec8b0">
      <circle cx="280" cy="140" r="3"/>
      <circle cx="340" cy="130" r="3"/>
      <circle cx="398" cy="145" r="3"/>
      <circle cx="410" cy="195" r="3"/>
      <circle cx="390" cy="255" r="3"/>
      <circle cx="330" cy="270" r="3"/>
      <circle cx="275" cy="245" r="3"/>
      <circle cx="265" cy="185" r="3"/>
    </g>
    <!-- Dominant central hub -->
    <circle cx="339" cy="200" r="16" fill="#ff956d" fill-opacity=".18"/>
    <circle cx="339" cy="200" r="10" fill="#dc512f" stroke="#ff956d" stroke-width="1.5"/>
    <text x="339" y="203" font-family="Consolas, monospace" font-size="7" fill="#fff" text-anchor="middle">HUB</text>

    <text x="258" y="320" font-family="Consolas, monospace" font-size="8.5" fill="#f4c6a0">Clustering: C ≈ 0.041</text>
    <text x="258" y="335" font-family="Consolas, monospace" font-size="8.5" fill="#f4c6a0">Scale-free tail: γ ≈ 3.0</text>
    <text x="258" y="350" font-family="Consolas, monospace" font-size="8.5" fill="#f4c6a0">Isolates: 0 (connected)</text>
  </g>

  <!-- COLUMN 3: REAL MARVEL & SHUFFLED NULL -->
  <g id="model-marvel">
    <rect x="456" y="72" width="188" height="296" rx="6" fill="#132238" stroke="#becbad" stroke-opacity=".3"/>
    <text x="468" y="94" font-family="Consolas, monospace" font-size="10" fill="#becbad" font-weight="bold">03 · REAL MARVEL</text>
    <text x="468" y="108" font-family="Consolas, monospace" font-size="8" fill="#8fa080">CLIQUE CLUSTERS + HUBS</text>
    
    <!-- Dense triad cluster 1 (Avengers core) -->
    <g stroke="#a3bdab" stroke-opacity=".5" stroke-width="1">
      <polygon points="500,160 550,140 540,195" fill="#2849c7" fill-opacity=".12"/>
      <polygon points="540,195 550,140 595,170" fill="#2849c7" fill-opacity=".12"/>
      <line x1="500" y1="160" x2="520" y2="245"/>
      <line x1="540" y1="195" x2="520" y2="245"/>
      <line x1="540" y1="195" x2="570" y2="250" stroke-width="1.4" stroke="#ff956d"/>
      <line x1="595" y1="170" x2="570" y2="250"/>
    </g>
    <!-- Real nodes with varying degree -->
    <circle cx="500" cy="160" r="5" fill="#adc5f5"/>
    <circle cx="550" cy="140" r="7" fill="#adc5f5"/>
    <circle cx="595" cy="170" r="5.5" fill="#adc5f5"/>
    <circle cx="520" cy="245" r="4" fill="#adc5f5"/>
    <!-- Spidey mega-hub -->
    <circle cx="540" cy="195" r="14" fill="#ff956d" fill-opacity=".22"/>
    <circle cx="540" cy="195" r="9" fill="#ff956d" stroke="#f6f1e7" stroke-width="1.2"/>
    <!-- Separate Island (Morituri) -->
    <g stroke="#ecdba9" stroke-opacity=".4" stroke-width=".8" fill="none">
      <polygon points="600,230 625,245 610,265"/>
    </g>
    <circle cx="600" cy="230" r="3.5" fill="#ecdba9"/>
    <circle cx="625" cy="245" r="3" fill="#ecdba9"/>
    <circle cx="610" cy="265" r="4.5" fill="#ecdba9"/>
    <!-- Isolated zero-degree node -->
    <circle cx="480" cy="265" r="3" fill="#7a8fa6" stroke="#f2a078" stroke-width=".8" stroke-dasharray="2 2"/>

    <text x="468" y="320" font-family="Consolas, monospace" font-size="8.5" fill="#becbad">Clustering: C = 0.320!</text>
    <text x="468" y="335" font-family="Consolas, monospace" font-size="8.5" fill="#becbad">Paradox: 87.4% trapped</text>
    <text x="468" y="350" font-family="Consolas, monospace" font-size="8.5" fill="#becbad">Isolates: 17 quiet ones</text>
  </g>

  <!-- LOWER INSTRUMENTATION PANEL -->
  <g id="instrument-deck" transform="translate(36, 400)">
    <rect width="608" height="162" rx="6" fill="#0e1b2e" stroke="#b0bdd9" stroke-opacity=".2"/>
    
    <!-- Header strip -->
    <path d="M0 0 H608 V28 H0 Z" fill="#172842" rx="6"/>
    <text x="16" y="18" font-family="Consolas, monospace" font-size="9" fill="#ff956d" font-weight="bold" letter-spacing="1">SHUFFLE TEST (MASLOV–SNEPPEN DOUBLE EDGE SWAP): SURVIVORS VS CASUALTIES</text>
    
    <!-- Table columns -->
    <g font-family="Consolas, monospace" font-size="8.5" fill="#d0daf0">
      <!-- Metric 1: Degree distribution -->
      <g transform="translate(16, 46)">
        <text x="0" y="0" fill="#f2a078" font-weight="bold">DEGREE SEQUENCE P(k)</text>
        <text x="0" y="16" fill="#adc5f5">Real: Heavy tail (k=106)</text>
        <text x="0" y="30" fill="#a3bdab">Swap: Strictly Identical</text>
        <text x="0" y="46" fill="#70d68a" font-weight="bold">STATUS: SURVIVES 100%</text>
      </g>
      
      <!-- Metric 2: Friendship Paradox -->
      <g transform="translate(170, 46)">
        <text x="0" y="0" fill="#f2a078" font-weight="bold">FRIENDSHIP PARADOX</text>
        <text x="0" y="16" fill="#adc5f5">Real: &lt;k_fr&gt; = 22.25</text>
        <text x="0" y="30" fill="#a3bdab">Swap: &lt;k_fr&gt; = 22.25</text>
        <text x="0" y="46" fill="#70d68a" font-weight="bold">STATUS: SURVIVES (σ²)</text>
      </g>

      <!-- Metric 3: Clustering C -->
      <g transform="translate(325, 46)">
        <text x="0" y="0" fill="#f2a078" font-weight="bold">TRIADIC CLUSTERING C</text>
        <text x="0" y="16" fill="#adc5f5">Real: C = 0.320</text>
        <text x="0" y="30" fill="#a3bdab">Swap: C = 0.155 (z=19.6)</text>
        <text x="0" y="46" fill="#f27265" font-weight="bold">STATUS: DIES (&gt;50% DROP)</text>
      </g>

      <!-- Metric 4: Reciprocity -->
      <g transform="translate(470, 46)">
        <text x="0" y="0" fill="#f2a078" font-weight="bold">RECIPROCITY</text>
        <text x="0" y="16" fill="#adc5f5">Real: 39.0% (348 pairs)</text>
        <text x="0" y="30" fill="#a3bdab">Swap: ~3.0% (random)</text>
        <text x="0" y="46" fill="#f27265" font-weight="bold">STATUS: DESTROYED</text>
      </g>
    </g>

    <!-- Bottom summary bar -->
    <path d="M16 114 H592" stroke="#b0bdd9" stroke-opacity=".18" stroke-width="1"/>
    <text x="16" y="136" font-family="Consolas, monospace" font-size="8" fill="#9eb1c7">VERDICT: The survivors are mechanical consequences of the degree sequence alone. The casualties reveal genuine comic storytelling.</text>
  </g>

  <!-- Bottom Captions -->
  <g font-family="Consolas, monospace" font-size="8" fill="#8fa0b5">
    <text x="36" y="620" fill="#f2a078">FIG. 002 — ARCHETYPES &amp; NULL MODELS</text>
    <text x="644" y="620" text-anchor="end">DTU 02805 · WEEK 2</text>
  </g>
</svg>

